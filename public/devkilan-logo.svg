<svg width="280" height="60" viewBox="0 0 280 60" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>devKilan logo</title>
  <desc>devKilan — developer portfolio logo</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace, 'Courier New'; }
    </style>
  </defs>

  <!-- Left bracket -->
  <text x="2" y="44" class="mono" font-size="48" font-weight="700" fill="#39d98a">{</text>

  <!-- "dev" -->
  <text x="36" y="42" class="mono" font-size="24" font-weight="400" fill="#39d98a" letter-spacing="1">dev</text>

  <!-- "Kilan" -->
  <text x="99" y="42" class="mono" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="0.5">Kilan</text>

  <!-- Blinking cursor -->
  <rect x="258" y="16" width="12" height="24" rx="2" fill="#39d98a" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Right bracket -->
  <text x="272" y="44" class="mono" font-size="48" font-weight="700" fill="#39d98a">}</text>
</svg>
